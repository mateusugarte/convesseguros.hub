<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Agentes — Conves Hub</title>
<style>
  :root {
    --bg:        #0A0F1E;
    --bg2:       #111827;
    --bg3:       #1F2937;
    --border:    #1F2937;
    --text:      #F9FAFB;
    --text-muted:#9CA3AF;
    --primary:   #1A3A6B;
    --accent:    #4A90D9;
    --gold:      #C9A84C;

    --sistemas:    #4A90D9;
    --seguranca:   #EF4444;
    --performance: #F59E0B;
    --melhorias:   #10B981;
    --orquestrador:#A78BFA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    color: white;
  }

  .header-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .header-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .ws-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 10px;
    background: var(--bg3);
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .ws-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6B7280;
    transition: background 0.3s;
  }

  .ws-dot.connected { background: #10B981; box-shadow: 0 0 6px #10B981; }
  .ws-dot.connecting { background: #F59E0B; animation: pulse 1s infinite; }
  .ws-dot.error { background: #EF4444; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  sidebar {
    width: 220px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-section {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .agent-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    margin-bottom: 2px;
  }

  .agent-btn:hover { background: var(--bg3); }
  .agent-btn.active { background: var(--bg3); }

  .agent-icon {
    font-size: 16px;
    width: 24px;
    text-align: center;
  }

  .agent-info { flex: 1; }

  .agent-name {
    font-size: 13px;
    font-weight: 500;
  }

  .agent-cmd {
    font-size: 10px;
    color: var(--text-muted);
  }

  .agent-count {
    font-size: 11px;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text-muted);
    font-weight: 600;
  }

  .cmd-btn {
    display: block;
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    text-align: left;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    transition: all 0.15s;
    margin-bottom: 4px;
  }

  .cmd-btn:hover {
    background: var(--bg3);
    color: var(--text);
    border-color: var(--accent);
  }

  /* CHAT AREA */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

  /* Mensagens */
  .msg {
    display: flex;
    gap: 10px;
    max-width: 800px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { margin-left: auto; flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    background: var(--bg3);
    border: 2px solid var(--border);
  }

  .msg-bubble {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    max-width: calc(100% - 42px);
    line-height: 1.55;
  }

  .msg.user .msg-bubble {
    background: var(--primary);
    border-color: var(--accent);
  }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }

  .msg-agent-name {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .msg-text {
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Segurança tem borda especial */
  .msg.seguranca .msg-bubble {
    border-left: 3px solid var(--seguranca);
    background: #1A0A0A;
  }

  /* Thinking */
  .msg-thinking .msg-bubble {
    background: var(--bg3);
    border-style: dashed;
  }

  .thinking-dots span {
    display: inline-block;
    animation: blink 1.2s infinite;
    font-size: 18px;
    line-height: 1;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
  }

  /* Error */
  .msg-error .msg-bubble {
    background: #1A0808;
    border-color: var(--seguranca);
    color: #FCA5A5;
  }

  /* Reunião stagger */
  .msg-reuniao {
    animation: fadeIn 0.3s ease both;
  }

  /* Separador de reunião */
  .reuniao-header {
    text-align: center;
    color: var(--orquestrador);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  /* INPUT */
  .input-area {
    padding: 12px 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .chip {
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    transition: all 0.15s;
  }

  .chip:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--bg);
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    padding: 10px 14px;
    resize: none;
    outline: none;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    min-height: 42px;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .send-btn:hover { background: #5BA0E9; transform: scale(1.05); }
  .send-btn:disabled { background: var(--bg3); color: var(--text-muted); cursor: default; transform: none; }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .welcome-icon { font-size: 48px; margin-bottom: 12px; }
  .welcome h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 13px; line-height: 1.6; }

  .welcome-agents {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .welcome-agent {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    background: var(--bg2);
  }

  .welcome-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">C</div>
    <div>
      <div class="header-title">Painel de Agentes</div>
      <div class="header-sub">Conves Hub</div>
    </div>
  </div>
  <div class="ws-status">
    <div class="ws-dot connecting" id="wsDot"></div>
    <span id="wsLabel">Conectando...</span>
  </div>
</header>

<div class="layout">

  <sidebar>
    <div class="sidebar-section">
      <div class="sidebar-label">Agentes</div>
      <button class="agent-btn" onclick="setAgent('sistemas')" id="btn-sistemas">
        <div class="agent-icon">🔧</div>
        <div class="agent-info">
          <div class="agent-name" style="color: var(--sistemas)">Sistemas</div>
          <div class="agent-cmd">/sistemas</div>
        </div>
        <div class="agent-count" id="count-sistemas">0</div>
      </button>
      <button class="agent-btn" onclick="setAgent('seguranca')" id="btn-seguranca">
        <div class="agent-icon">🛡️</div>
        <div class="agent-info">
          <div class="agent-name" style="color: var(--seguranca)">Segurança</div>
          <div class="agent-cmd">/segurança</div>
        </div>
        <div class="agent-count" id="count-seguranca">0</div>
      </button>
      <button class="agent-btn" onclick="setAgent('performance')" id="btn-performance">
        <div class="agent-icon">⚡</div>
        <div class="agent-info">
          <div class="agent-name" style="color: var(--performance)">Performance</div>
          <div class="agent-cmd">/performance</div>
        </div>
        <div class="agent-count" id="count-performance">0</div>
      </button>
      <button class="agent-btn" onclick="setAgent('melhorias')" id="btn-melhorias">
        <div class="agent-icon">💡</div>
        <div class="agent-info">
          <div class="agent-name" style="color: var(--melhorias)">Melhorias</div>
          <div class="agent-cmd">/melhorias</div>
        </div>
        <div class="agent-count" id="count-melhorias">0</div>
      </button>
    </div>

    <div class="sidebar-section" style="flex:1; overflow-y:auto;">
      <div class="sidebar-label">Comandos rápidos</div>
      <button class="cmd-btn" onclick="insertCmd('/melhorias')">/melhorias</button>
      <button class="cmd-btn" onclick="insertCmd('/sistemas')">/sistemas</button>
      <button class="cmd-btn" onclick="insertCmd('/segurança')">/segurança</button>
      <button class="cmd-btn" onclick="insertCmd('/performance')">/performance</button>
      <button class="cmd-btn" onclick="insertCmd('/reuniao estado geral')">/reuniao estado geral</button>
      <button class="cmd-btn" onclick="insertCmd('/reuniao fichas kanban')">/reuniao fichas</button>
      <button class="cmd-btn" onclick="insertCmd('/reuniao próxima fase')">/reuniao próxima fase</button>
    </div>
  </sidebar>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>Painel de Agentes — Conves Hub</h2>
        <p>Digite uma pergunta ou use um comando para consultar os agentes especializados.</p>
        <div class="welcome-agents">
          <div class="welcome-agent">
            <div class="welcome-dot" style="background: var(--sistemas)"></div>
            Sistemas
          </div>
          <div class="welcome-agent">
            <div class="welcome-dot" style="background: var(--seguranca)"></div>
            Segurança
          </div>
          <div class="welcome-agent">
            <div class="welcome-dot" style="background: var(--performance)"></div>
            Performance
          </div>
          <div class="welcome-agent">
            <div class="welcome-dot" style="background: var(--melhorias)"></div>
            Melhorias
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="chips">
        <span class="chip" onclick="insertCmd('/melhorias')">/melhorias</span>
        <span class="chip" onclick="insertCmd('/sistemas')">/sistemas</span>
        <span class="chip" onclick="insertCmd('/segurança')">/segurança</span>
        <span class="chip" onclick="insertCmd('/performance')">/performance</span>
        <span class="chip" onclick="insertCmd('/reuniao ')">/reuniao</span>
      </div>
      <div class="input-row">
        <textarea
          id="input"
          placeholder="Digite sua pergunta ou use /comando..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Enviar (Enter)">➤</button>
      </div>
    </div>
  </div>

</div>

<script>
const AGENT_META = {
  sistemas:    { icon: '🔧', name: 'Sistemas',    color: '#4A90D9' },
  seguranca:   { icon: '🛡️', name: 'Segurança',   color: '#EF4444' },
  performance: { icon: '⚡', name: 'Performance', color: '#F59E0B' },
  melhorias:   { icon: '💡', name: 'Melhorias',   color: '#10B981' },
  orquestrador:{ icon: '🤖', name: 'Orquestrador',color: '#A78BFA' },
}

const counts = { sistemas: 0, seguranca: 0, performance: 0, melhorias: 0 }
let ws = null
let thinkingMsgId = null
let isWaiting = false

// WebSocket
function connect() {
  setStatus('connecting', 'Conectando...')
  ws = new WebSocket('ws://localhost:3001')

  ws.onopen = () => {
    setStatus('connected', 'Conectado')
  }

  ws.onclose = () => {
    setStatus('error', 'Desconectado — reconectando em 3s...')
    setTimeout(connect, 3000)
  }

  ws.onerror = () => {
    setStatus('error', 'Erro de conexão')
  }

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data)
    handleServerMessage(data)
  }
}

function setStatus(state, label) {
  const dot = document.getElementById('wsDot')
  const lbl = document.getElementById('wsLabel')
  dot.className = 'ws-dot ' + state
  lbl.textContent = label
}

function handleServerMessage(data) {
  if (data.type === 'thinking') {
    removeThinking()
    thinkingMsgId = addThinking(data.agent)
    return
  }

  if (data.type === 'response') {
    removeThinking()
    parseAndRenderResponse(data.raw, data.agent)
    isWaiting = false
    document.getElementById('sendBtn').disabled = false
    return
  }

  if (data.type === 'error') {
    removeThinking()
    addErrorMsg(data.message)
    isWaiting = false
    document.getElementById('sendBtn').disabled = false
  }
}

// Parseia a resposta — detecta formato AGENTE: nome | texto
function parseAndRenderResponse(raw, fallbackAgent) {
  if (!raw) return

  // Tenta detectar múltiplos agentes (reunião)
  const lineRegex = /^AGENTE:\s*(\w+)\s*\|\s*(.+)/gim
  const matches = [...raw.matchAll(lineRegex)]

  if (matches.length > 1) {
    // Reunião: múltiplos agentes
    addReuniaoHeader()
    matches.forEach((m, i) => {
      const agentKey = normalizeAgent(m[1])
      const text = m[2].trim()
      setTimeout(() => addAgentMsg(agentKey, text), i * 200)
    })
  } else if (matches.length === 1) {
    const agentKey = normalizeAgent(matches[0][1])
    const text = matches[0][2].trim()
    addAgentMsg(agentKey, text)
  } else {
    // Sem formato específico — usar agente detectado ou fallback
    addAgentMsg(fallbackAgent || 'sistemas', raw)
  }
}

function normalizeAgent(name) {
  const n = name.toLowerCase().trim()
  if (n.includes('sist')) return 'sistemas'
  if (n.includes('seg') || n.includes('guard')) return 'seguranca'
  if (n.includes('perf') || n.includes('veloc')) return 'performance'
  if (n.includes('melh') || n.includes('ux')) return 'melhorias'
  return n
}

// Renderização de mensagens
function hideWelcome() {
  const w = document.getElementById('welcome')
  if (w) w.remove()
}

function addUserMsg(text) {
  hideWelcome()
  const msgs = document.getElementById('messages')
  const div = document.createElement('div')
  div.className = 'msg user'
  div.innerHTML = `
    <div class="msg-avatar">👤</div>
    <div class="msg-bubble">
      <div class="msg-text">${escHtml(text)}</div>
    </div>`
  msgs.appendChild(div)
  scrollDown()
}

function addAgentMsg(agentKey, text) {
  hideWelcome()
  const meta = AGENT_META[agentKey] || AGENT_META.sistemas
  const msgs = document.getElementById('messages')
  const div = document.createElement('div')
  div.className = `msg ${agentKey}`

  if (agentKey in counts) {
    counts[agentKey]++
    document.getElementById(`count-${agentKey}`).textContent = counts[agentKey]
  }

  const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  div.innerHTML = `
    <div class="msg-avatar" style="border-color:${meta.color}">${meta.icon}</div>
    <div class="msg-bubble">
      <div class="msg-header">
        <span class="msg-agent-name" style="color:${meta.color}">${meta.name}</span>
        <span class="msg-time">${time}</span>
      </div>
      <div class="msg-text">${formatText(escHtml(text))}</div>
    </div>`
  msgs.appendChild(div)
  scrollDown()
}

function addReuniaoHeader() {
  hideWelcome()
  const msgs = document.getElementById('messages')
  const div = document.createElement('div')
  div.className = 'reuniao-header'
  div.textContent = '🤝 Reunião de Agentes'
  msgs.appendChild(div)
}

function addThinking(agentKey) {
  hideWelcome()
  const meta = AGENT_META[agentKey] || AGENT_META.sistemas
  const msgs = document.getElementById('messages')
  const id = 'thinking-' + Date.now()
  const div = document.createElement('div')
  div.className = 'msg msg-thinking'
  div.id = id
  div.innerHTML = `
    <div class="msg-avatar" style="border-color:${meta.color}">${meta.icon}</div>
    <div class="msg-bubble">
      <div class="msg-header">
        <span class="msg-agent-name" style="color:${meta.color}">${meta.name}</span>
      </div>
      <div class="thinking-dots">
        <span>●</span><span>●</span><span>●</span>
      </div>
    </div>`
  msgs.appendChild(div)
  scrollDown()
  return id
}

function removeThinking() {
  if (thinkingMsgId) {
    const el = document.getElementById(thinkingMsgId)
    if (el) el.remove()
    thinkingMsgId = null
  }
}

function addErrorMsg(message) {
  const msgs = document.getElementById('messages')
  const div = document.createElement('div')
  div.className = 'msg msg-error'
  div.innerHTML = `
    <div class="msg-avatar">⚠️</div>
    <div class="msg-bubble">
      <div class="msg-header">
        <span class="msg-agent-name" style="color:#EF4444">Erro</span>
      </div>
      <div class="msg-text">${escHtml(message)}</div>
    </div>`
  msgs.appendChild(div)
  scrollDown()
}

// Envio de mensagem
function sendMessage() {
  if (isWaiting) return
  const input = document.getElementById('input')
  const text = input.value.trim()
  if (!text) return
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addErrorMsg('WebSocket não conectado. Aguarde a reconexão.')
    return
  }

  addUserMsg(text)
  ws.send(JSON.stringify({ message: text }))
  input.value = ''
  autoResize(input)
  isWaiting = true
  document.getElementById('sendBtn').disabled = true
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage()
  }
}

function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 120) + 'px'
}

function insertCmd(cmd) {
  const input = document.getElementById('input')
  input.value = cmd
  input.focus()
  autoResize(input)
  // Posicionar cursor no final
  input.setSelectionRange(input.value.length, input.value.length)
}

function setAgent(name) {
  document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'))
  const btn = document.getElementById('btn-' + name)
  if (btn) btn.classList.add('active')
  insertCmd('/' + name + ' ')
}

function scrollDown() {
  const msgs = document.getElementById('messages')
  msgs.scrollTop = msgs.scrollHeight
}

// Formata texto — negrito simples e separadores
function formatText(html) {
  return html
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/━+/g, '<hr style="border:none;border-top:1px solid var(--border);margin:6px 0">')
    .replace(/\n/g, '<br>')
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
}

// Iniciar
connect()
</script>
</body>
